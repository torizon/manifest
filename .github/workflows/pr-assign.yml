name: Auto Self-Assign PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize] # <-- Added synchronized to easily re-trigger

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR Author
        uses: toshimaru/auto-author-assign@v3.1.0

